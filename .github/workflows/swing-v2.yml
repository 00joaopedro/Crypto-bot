name: Swing pullback v2 (frozen final round)
on:
  pull_request:
    paths:
      - 'src/swing-v2-*.ts'
      - 'src/maker-public-minutes.ts'
      - 'examples/swing-v2*.json'
      - 'tests/swing-v2*.test.ts'
      - 'docs/swing-v2*'
      - '.github/workflows/swing-v2.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: swing-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: .swing-v2-data
          key: swing-v2-final-${{ hashFiles('examples/swing-v2.plan.json') }}
      - name: Collect public closed candles and replay frozen rules (no private access or orders)
        run: npm run strategy:swing-v2 -- --collect .swing-v2-data .swing-v2-results
      - name: Reproduce source and ledgers without network
        run: |
          npm run strategy:swing-v2 -- --replay .swing-v2-data .swing-v2-reproduction
          diff -u .swing-v2-results/summary.json .swing-v2-reproduction/summary.json
          diff -u .swing-v2-results/ledgers.json .swing-v2-reproduction/ledgers.json
          if [ -f docs/swing-v2-results.json ]; then
            diff -u docs/swing-v2-results.json .swing-v2-results/summary.json
            diff -u docs/swing-v2-ledgers.json .swing-v2-results/ledgers.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-v2-research
          path: |
            .swing-v2-data/
            .swing-v2-results/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
